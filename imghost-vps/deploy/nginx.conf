# Generated from config.json by scripts/nginx-config.js.
server {
    listen HTTP_PORT;
    listen [::]:HTTP_PORT;
    TLS_LISTEN
    server_name SERVER_NAME;
    # Relative redirects retain Cloudflare's browser-facing host and port.
    absolute_redirect off;
    client_max_body_size BODY_LIMITm;

    location / {
        proxy_pass http://127.0.0.1:APP_PORT;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /_imagehost_database_auth {
        internal;
        proxy_pass http://127.0.0.1:APP_PORT/api/manage/database-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location = /phpmyadmin { return 302 /phpmyadmin/; }
    location /phpmyadmin/ {
        auth_request /_imagehost_database_auth;
        error_page 401 = @database_login;
        root /usr/share;
        index index.php;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/phpmyadmin/(setup|libraries|templates)/ { deny all; }
    location ~ /\. { deny all; }

    # PHP requests need their OWN gate; the prefix location is not inherited.
    location ~ ^/phpmyadmin/(.+\.php)$ {
        auth_request /_imagehost_database_auth;
        error_page 401 = @database_login;
        root /usr/share;
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        add_header Cache-Control "no-store" always;
    }

    location @database_login { return 302 /manage; }
}
